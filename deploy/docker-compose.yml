# Whole platform on one host, one public port (EDGE_PORT, default 8080):
#
#   browser ──► edge (nginx) ──► frontend (nginx, prebuilt SPA)
#                             ├─► gateway  (Go, MT5 Manager API gateway)
#                             └─► demomarket (simulated market + CRM — this is
#                                             a demo platform; no broker exists)
#
# Run from this directory on the host: docker compose up -d --build
# gateway.env is created by deploy.sh (fresh random secrets) — see
# gateway.env.example.

name: tradeplatform

services:
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${EDGE_PORT:-8080}:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      gateway:
        condition: service_started
    networks: [platform]

  frontend:
    build:
      context: ./frontend-build      # assembled by deploy.sh: dist/ + nginx.conf + entrypoint.sh
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: frontend.env
    networks: [platform]

  gateway:
    build:
      context: ../backend
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    env_file: gateway.env
    depends_on:
      - demomarket
    networks: [platform]

  demomarket:
    build:
      context: ../backend
      dockerfile: deploy/docker/Dockerfile.demomarket
    restart: unless-stopped
    networks: [platform]

networks:
  platform:
    driver: bridge
    ipam:
      config:
        # Pinned so gateway.env can trust X-Forwarded-For from `edge` only
        # (RATE_LIMIT_TRUSTED_PROXIES).
        - subnet: 172.30.0.0/24
