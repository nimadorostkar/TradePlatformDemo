# Edge proxy: the ONE origin the browser talks to. The terminal is served at /, the gateway under
# /gateway/ and the CRM under /crm/, so every call is same-origin (no CORS, and
# the gateway's session cookies are first-party).

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  access_log off;
  server_tokens off;
  client_max_body_size 1m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Resolve service names per request through Docker's embedded DNS. A static
  # `upstream {}` block is resolved once at startup, so every `docker compose
  # up` that recreates a container behind this proxy would leave the edge
  # pointing at a dead IP (502) until it was restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    set $frontend http://frontend:8080;
    set $gateway  http://gateway:5063;
    set $crm      http://mockmt5:5199;

    # Gateway REST + /ws stream, served under /gateway/ (prefix stripped).
    location /gateway/ {
      rewrite ^/gateway/(.*)$ /$1 break;
      proxy_pass $gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;   # long-lived WebSocket subscriptions
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # CRM (account list) — the terminal calls it directly from the browser.
    location /crm/ {
      rewrite ^/crm/(.*)$ /$1 break;
      proxy_pass $crm;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass $frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
