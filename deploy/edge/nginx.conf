# Edge proxy: the ONE origin the browser talks to. The terminal is served at /, the gateway under
# /gateway/ and the CRM under /crm/, so every call is same-origin (no CORS, and
# the gateway's session cookies are first-party).

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  access_log off;
  server_tokens off;
  client_max_body_size 1m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream frontend { server frontend:8080; }
  upstream gateway  { server gateway:5063; }
  upstream crm      { server mockmt5:5199; }

  server {
    listen 80;
    server_name _;

    # Gateway REST + /ws stream. The trailing slash strips the /gateway prefix.
    location /gateway/ {
      proxy_pass http://gateway/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;   # long-lived WebSocket subscriptions
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # CRM (account list) — the terminal calls it directly from the browser.
    location /crm/ {
      proxy_pass http://crm/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
