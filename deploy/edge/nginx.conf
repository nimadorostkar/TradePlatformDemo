# Edge proxy: the origins the browser talks to. Each host serves its
# application at / with the gateway under /gateway/ and the CRM under /crm/,
# so every call is same-origin (no CORS, first-party session cookies):
#
#   - the default server (the bare IP, or any unknown name): the terminal at /
#     and the client area under /pa — one host, no DNS needed;
#   - TERMINAL_HOST and CLIENT_AREA_HOST, when set: one subdomain each. The
#     SPA reads which origin it is on and serves the right application from
#     the root (frontend/src/app/surfaces.ts).
#
# The server blocks live in templates/*.template: the nginx image renders
# them with the TERMINAL_HOST / CLIENT_AREA_HOST environment at start.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  access_log off;
  server_tokens off;
  client_max_body_size 1m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Resolve service names per request through Docker's embedded DNS. A static
  # `upstream {}` block is resolved once at startup, so every `docker compose
  # up` that recreates a container behind this proxy would leave the edge
  # pointing at a dead IP (502) until it was restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Only the rendered hosts file: the image also ships a stock default.conf.
  include /etc/nginx/conf.d/hosts.conf;
}
