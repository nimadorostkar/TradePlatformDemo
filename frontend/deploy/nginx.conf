worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Unprivileged nginx cannot write to the default paths.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  log_format json escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
    '"ref":"$http_referer","ua":"$http_user_agent"}';
  # `$uri` is logged rather than `$request`, so a query string can never carry
  # an access token into the access log.
  access_log /dev/stdout json;

  sendfile on;
  tcp_nopush on;
  server_tokens off;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────────
    #
    # CSP. The chart is TradingView's open-source Lightweight Charts, bundled
    # with the app: no eval, no third-party script, no iframe. 'unsafe-inline'
    # in style-src is for the library's inline canvas container styles.
    # connect-src is widened to the gateway/CRM origins at deploy time; the
    # entrypoint substitutes them from the environment.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${CSP_CONNECT_SRC}; worker-src 'self'; child-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors ${CSP_FRAME_ANCESTORS}" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static health endpoint for the container and the load balancer. It says
    # nothing about the gateway — that is reported inside the app, from the
    # real connection state.
    location = /healthz {
      access_log off;
      add_header Content-Type application/json;
      return 200 '{"status":"ok"}';
    }

    # Hashed assets are immutable.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on old assets.
    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      expires -1;
    }

    # SPA routing.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # NOTE: this container serves the SPA only and talks to the gateway
    # cross-origin, with `connect-src` widened at start by the entrypoint.
    # There is deliberately no same-origin proxy here. The Windows/Caddy
    # deployment does proxy `/gateway` and `/crm` same-origin; if you need that
    # behaviour in the container, add it explicitly rather than expecting the
    # entrypoint to synthesise it.
  }
}
