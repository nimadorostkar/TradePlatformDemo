name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tests use httptest/miniredis and the repository's mock MT5 contracts only.
# No workflow secret or production endpoint is available to these jobs, so CI
# cannot submit or mutate a real trade, order, position, balance, or account.
env:
  GOTOOLCHAIN: local

# The Go gateway lives in backend/ of the monorepo. Every `run:` step below
# executes from there; paths handed to actions (go.mod, artifacts) are
# repo-relative and spelled out explicitly.
defaults:
  run:
    working-directory: backend

jobs:
  verify:
    name: Format, vet, race and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Verify enforced toolchain
        run: test "$(go env GOVERSION)" = "go1.26.6"

      - name: Verify module files are canonical
        run: go mod tidy -diff

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Race-detector suite
        run: go test -race ./...

      - name: Install official vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./...

  stores:
    name: Database-backed store tests
    runs-on: ubuntu-latest
    # The alert, workspace, and price-history SQL is skipped without a DSN, so
    # `go test ./...` reported it green while never running a single query.
    # This job supplies the database so the schema, the compare-and-set that
    # stops an alert firing twice, the COPY upsert, the daily aggregation, and
    # the advisory locks are actually exercised.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: opotest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Run store tests against PostgreSQL
        env:
          APPDATA_TEST_DSN: postgres://postgres:test@127.0.0.1:5432/opotest?sslmode=disable
          TIMESCALE_TEST_DSN: postgres://postgres:test@127.0.0.1:5432/opotest?sslmode=disable
        run: go test -race -count=1 ./internal/store/...

      - name: Fail if the store tests silently skipped
        env:
          APPDATA_TEST_DSN: postgres://postgres:test@127.0.0.1:5432/opotest?sslmode=disable
          TIMESCALE_TEST_DSN: postgres://postgres:test@127.0.0.1:5432/opotest?sslmode=disable
        # A skip here means the DSN wiring broke and this job is proving nothing.
        run: |
          go test -count=1 -v ./internal/store/... 2>&1 | tee store.log
          if grep -q -- "--- SKIP" store.log; then
            echo "::error::store tests skipped — the test DSN did not reach them"
            exit 1
          fi

  e2e:
    name: End-to-end against the mock MT5
    runs-on: ubuntu-latest
    # Exercises the wired binary — routing, auth, ownership, the WebSocket
    # contract, CORS, rate limiting and metrics — which unit tests do not cover.
    # It runs with hardened production settings, so a regression that only shows
    # up under the secure defaults fails here.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Build gateway, mock MT5 and the WebSocket probe
        run: |
          go build -o bin/gateway ./cmd/gateway
          go build -o bin/mockmt5 ./scripts/mockmt5
          go build -o bin/wsprobe ./scripts/wsprobe

      - name: Run the suite
        env:
          # No real broker, CRM, or secret is reachable from this job: the mock
          # serves every upstream path, so no live order can be placed.
          ENVIRONMENT: production
          HTTP_ADDR: 127.0.0.1:5063
          METRICS_ADDR: 127.0.0.1:9090
          MT5_HOST_URL: http://127.0.0.1
          MT5_PORT: "5199"
          MT5_LOGIN: "1"
          MT5_PASSWORD: mock-password-not-a-secret
          CRM_URL: http://127.0.0.1:5199
          JWT_SECRET_KEY: ci-only-key-not-a-secret
          JWT_ISSUER: https://issuer.ci.invalid
          JWT_AUDIENCE: ci-clients
          CORS_ALLOWED_ORIGINS: https://app.opofinance.com
          MANAGER_API_KEY: ci000000000000000000000000000000000
          CRM_ALLOWED_ACCOUNT_TYPES: "11,26,57,58,59,60,61,62,63,64,65,66,67"
          RATE_LIMIT_RPS: "50"
          RATE_LIMIT_BURST: "100"
        run: |
          ./bin/mockmt5 -addr :5199 &
          ./bin/gateway > gateway.log 2> gateway.err &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5063/readyz >/dev/null 2>&1 && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:5063 \
          METRICS_URL=http://127.0.0.1:9090/metrics \
          WSPROBE=./bin/wsprobe \
            ./scripts/e2e_test.sh | tee e2e.log
          grep -q ", 0 failed" e2e.log

      - name: Assert nothing was written to stderr
        # A service launcher that treats native stderr as fatal already took the
        # gateway down once. Keeping stderr empty is a contract, not a nicety.
        run: |
          if [ -s gateway.err ]; then
            echo "::error::gateway wrote to stderr:"; cat gateway.err; exit 1
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            backend/gateway.log
            backend/gateway.err
            backend/e2e.log

  artifacts:
    name: Reproducible production artifacts
    runs-on: ubuntu-latest
    needs: [verify, stores, e2e]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Build Windows and Linux gateways
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/gateway-windows-amd64.exe ./cmd/gateway
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/gateway-linux-amd64 ./cmd/gateway

      - name: Record provenance and checksums
        run: |
          go version > dist/toolchain.txt
          go version -m dist/gateway-windows-amd64.exe > dist/gateway-windows-amd64.buildinfo.txt
          go version -m dist/gateway-linux-amd64 > dist/gateway-linux-amd64.buildinfo.txt
          cd dist
          sha256sum gateway-windows-amd64.exe gateway-linux-amd64 > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: gateway-${{ github.sha }}
          path: backend/dist/
          if-no-files-found: error
          retention-days: 14
