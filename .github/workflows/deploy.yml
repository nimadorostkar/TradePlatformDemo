name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel a deploy mid-flight.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No references to the previous operator
        run: ./scripts/check-no-legacy-refs.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Backend — fmt, vet, tests
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — typecheck, lint, format, unit tests
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
          npm run lint
          npm run format:check
          npm test

  deploy:
    name: Deploy to server
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - name: Require deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
        run: |
          missing=""
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS PUBLIC_ORIGIN; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Deployment is not configured. Missing:$missing"
            echo "Set the repository secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS"
            echo "and the repository variable PUBLIC_ORIGIN — see README → Deploying → CI/CD."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Optional. The TradingView Charting Library is licensed to YOU and is
      # never in git. If the repository secret TRADINGVIEW_PACKAGE_URL points
      # at a private tarball of your licensed package (containing
      # charting_library/ and datafeeds/), it is installed into the build;
      # otherwise the terminal deploys without a chart.
      - name: Install licensed TradingView package (if configured)
        working-directory: frontend
        env:
          TRADINGVIEW_PACKAGE_URL: ${{ secrets.TRADINGVIEW_PACKAGE_URL }}
        run: |
          if [ -z "$TRADINGVIEW_PACKAGE_URL" ]; then
            echo "TRADINGVIEW_PACKAGE_URL not set — deploying without the chart library."
            exit 0
          fi
          curl -fsSL "$TRADINGVIEW_PACKAGE_URL" -o /tmp/tradingview.tgz
          mkdir -p /tmp/tradingview && tar -xzf /tmp/tradingview.tgz -C /tmp/tradingview
          src=$(dirname "$(find /tmp/tradingview -type d -name charting_library | head -1)")
          npm run tv:sync -- --source="$src"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
        run: |
          : "${PUBLIC_ORIGIN:?set the repository variable PUBLIC_ORIGIN, e.g. http://203.0.113.10:8080}"
          export SSH_KEY="$HOME/.ssh/deploy_key"
          ./deploy/deploy.sh
