# Non-secret configuration. Secrets (JWT_SECRET_KEY, MT5_PASSWORD, DSNs with
# credentials) live in the Secret, not here.
#
# Every "__set_me__" below is per-deployment and has no built-in default: the
# gateway refuses to start rather than fall back to another firm's endpoints.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opotrade-gateway-config
  labels:
    app: opotrade-gateway
data:
  METRICS_ADDR: ":9090"
  HTTP_ADDR: ":5063"
  HTTP_READ_HEADER_TIMEOUT: "5s"
  HTTP_READ_TIMEOUT: "15s"
  HTTP_WRITE_TIMEOUT: "30s"
  HTTP_IDLE_TIMEOUT: "120s"
  HTTP_MAX_BODY_BYTES: "4194304"
  ENVIRONMENT: "production"
  ROLES: "all"

  MT5_HOST_URL: "__set_me__"        # e.g. https://tradeapp.your-broker.example
  MT5_PORT: "443"
  MT5_VERSION: "4410"
  MT5_AGENT: "WebManager"
  MT5_TYPE: "Manager"
  MT5_POOL_SIZE: "1"
  MT5_PING_INTERVAL: "20s"
  MT5_REQUEST_TIMEOUT: "30s"
  MT5_MAX_RESPONSE_BYTES: "33554432"
  MT5_READ_DATA_FROM_DB: "false"

  CRM_URL: "__set_me__"             # e.g. https://myaccount.your-broker.example

  JWT_ISSUER: "__set_me__"          # required when JWT_VALIDATE_ISSUER is "true"
  JWT_AUDIENCE: "__set_me__"        # required when JWT_VALIDATE_AUDIENCE is "true"
  # Transition: .NET-issued tokens carry no iss/aud claims, so validating them
  # would 401 every client still holding a .NET token at cutover. Keep these
  # "false" until all clients hold Go-issued tokens (>= JWT_EXPIRY after
  # cutover), then set both to "true".
  JWT_VALIDATE_ISSUER: "false"
  JWT_VALIDATE_AUDIENCE: "false"
  JWT_EXPIRY: "1h"

  # Hardened defaults (set the legacy values only during a client transition).
  WS_REQUIRE_AUTH: "true"
  CORS_ALLOWED_ORIGINS: "__set_me__"  # csv of exact terminal origins

  WS_PUSH_CADENCE: "3s"
  WS_MAX_MESSAGE_SIZE: "16384"
  WS_WRITE_TIMEOUT: "10s"
  WS_SEND_BUFFER: "32"

  RATE_LIMIT_RPS: "50"
  RATE_LIMIT_BURST: "100"
  # Reverse proxies whose X-Forwarded-For is trusted, so the limiter and the
  # login throttle (HGH-02) key on the real client instead of the ingress IP.
  # Leaving this empty pools EVERY client behind the ingress into one bucket
  # (a single failed-sign-in lockout takes the whole site down). Set it to
  # loopback plus your ingress/pod network — replace 10.0.0.0/8 with the CIDR
  # your ingress controller actually forwards from.
  RATE_LIMIT_TRUSTED_PROXIES: "127.0.0.1/32,::1/128,10.0.0.0/8"

  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  DB_MAX_CONNS: "20"
