# CPU-based autoscaling (works out of the box). For connection-aware scaling on
# ws_active_connections, install prometheus-adapter and switch to a Pods metric
# (target ~5000 connections/pod) — see README.md.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: opotrade-gateway
  labels:
    app: opotrade-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: opotrade-gateway
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
